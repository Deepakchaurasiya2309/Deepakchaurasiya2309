name: Generate Snake

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ IMPORTANT: checkout repo (this fixes your error)
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Deepakchaurasiya2309
          outputs: github-contribution-grid-snake.svg

      - name: Commit Snake
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "Add snake animation" || echo "No changes"
          git push
